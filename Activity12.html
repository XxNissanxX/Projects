<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <title>Activity 12 - Grid Examples</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- Bootstrap CSS (v3.4.1 as in your screenshots) -->
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.1/css/bootstrap.min.css">

    <style type="text/css">
        h1 {
            color: green;
            margin: 16px 0;
        }

        /* colored boxes for the grid items */
        #a1,
        #a4 {
            color: white;
            background: olive;
            font-size: 20px;
            padding: 12px;
            border-radius: 4px;
        }

        #a2,
        #a5 {
            color: white;
            background: maroon;
            font-size: 20px;
            padding: 12px;
            border-radius: 4px;
        }

        #a3,
        #a6 {
            color: white;
            background: fuchsia;
            font-size: 20px;
            padding: 12px;
            border-radius: 4px;
        }

        body {
            padding: 18px;
        }
    </style>
</head>

<body>
    <div class="container-fluid">
        <h1>Unequal Area Grids</h1>

        <div class="row">
            <div id="a1" class="col-sm-3">Adding 1-3 grids (col-sm-3)</div>
            <div id="a2" class="col-sm-4">Adding 4-7 grids (col-sm-4)</div>
            <div id="a3" class="col-sm-5">Adding 8-12 grids (col-sm-5)</div>
        </div>

        <div class="row" style="margin-top:12px;">
            <div id="a4" class="col-sm-2">Adding 1-2 grids (col-sm-2)</div>
            <div id="a5" class="col-sm-6">Adding 3-8 grids (col-sm-6)</div>
            <div id="a6" class="col-sm-4">Adding 9-12 grids (col-sm-4)</div>
        </div>
    </div>

    <!-- jQuery and Bootstrap JS (for completeness) -->
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.4.1/jquery.min.js"></script>
    <script src="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.1/js/bootstrap.min.js"></script>
</body>

</html>
